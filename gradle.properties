org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
mod_id=observa
mod_name=observa
mod_version=0.1.0
mod_group_id=com.alvar.observa
mod_authors=ronidas
mod_license=MIT
mod_description=Read-only observability endpoint for Minecraft: live TPS/MSPT, entities, memory and GC, sampling and JFR profilers, log digests, crash black box, and an onboarding brief for agents.
